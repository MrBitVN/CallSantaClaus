name: Build Android & iOS (Native)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SantaCall_Magic.apk
          ls -lh SantaCall_Magic.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantaCall-Android-APK
          path: SantaCall_Magic.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Build iOS App Binary (iphoneos, arm64)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=ios/build

      - name: Package Sideloadable IPA (Payload/App.app)
        run: |
          APP_PATH=$(find ios/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "App.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          rm -rf Payload "$GITHUB_WORKSPACE/SantaCall_Magic.ipa"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/SantaCall_Magic.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/SantaCall_Magic.ipa"
          unzip -l "$GITHUB_WORKSPACE/SantaCall_Magic.ipa" | head -n 20

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantaCall-iOS-IPA
          path: SantaCall_Magic.ipa
          retention-days: 30

  publish-release:
    name: Publish Direct Download Release (APK & IPA)
    needs: [build-android, build-ios]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SantaCall-Android-APK

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SantaCall-iOS-IPA

      - name: Publish GitHub Release with APK & IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SantaCall Magic {0}', github.ref_name) || 'SantaCall Magic (Latest Native iOS IPA & Android APK)' }}
          body: |
            Direct download builds for **SantaCall Magic (100% Native Swift iOS & Kotlin Android — English)**:
            - **iOS**: Download `SantaCall_Magic.ipa` and install via Sideloadly / AltStore / TrollStore / Scarlet.
            - **Android**: Download `SantaCall_Magic.apk` and install directly on Android devices.
          files: |
            SantaCall_Magic.apk
            SantaCall_Magic.ipa
          draft: false
          prerelease: false
          make_latest: true
